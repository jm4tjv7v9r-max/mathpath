# Render Blueprint：一鍵建立「前端 + 後端同一個服務」，避免跨站 cookie 導致無法登入。
#
# ★ 最優方案（100 位學生規模）：plan=starter ＋ 2 GB 持久磁碟 ＋ Cloudflare R2。
#   - starter 才能掛持久磁碟（免費方案不支援），這是「重新部署不會清空資料」的唯一辦法。
#   - 磁碟 2 GB 就夠：資料庫一年約 200 MB，加上備份暫存檔仍綽綽有餘。
#   - 圖片一律走 Cloudflare R2（免費 10 GB），所以磁碟不需要很大。
#   總成本：US$7（starter）+ US$0.50（2 GB 磁碟）= 每月約 US$7.5。
#
#   若只想先試用、不想付費：把 plan 改成 free 並把下面 disk: 整段註解掉。
#   代價是每次重新部署都會清空題庫、學生帳號與作答（回到 2 個演示帳號 + 16 題種子題）。
services:
  - type: web
    name: mathpath
    runtime: python
    plan: starter
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: python -u server.py --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    # --- 資料保存（最優方案的核心）---
    # 掛載路徑必須是 data/ 的絕對路徑；Render 的 Python 服務原始碼在
    # /opt/render/project/src，所以資料庫會落在該目錄下的 data/。
    # 注意：掛了磁碟之後重新部署會有數秒停機，且該服務不能同時跑多個實例
    #       （對 100 人規模完全不是問題）。
    disk:
      name: mathpath-data
      mountPath: /opt/render/project/src/data
      sizeGB: 2
    envVars:
      - key: PYTHON_VERSION
        value: "3.13"
      # --- AI 模型端點 ---
      # DeepSeek：base_url=https://api.deepseek.com/v1
      #            model=deepseek-flash、vision_model=deepseek-flash
      # ⚠ 視覺模型只能用 deepseek-flash；deepseek-v4-pro 不支援圖片輸入。
      - key: MATH_AI_BASE_URL
        sync: false
      - key: MATH_AI_MODEL
        sync: false
      - key: MATH_AI_VISION_MODEL
        sync: false
      - key: MATH_AI_API_KEY
        sync: false
      # 省錢模式：off=關閉思考（預設，輸出 token 少很多）；on=開啟思考（較準確但貴很多）
      - key: MATH_AI_THINKING
        sync: false
      # 強烈建議設定：鎖住「更換模型端點」頁面，避免任何人亂改 AI 設定
      - key: MATH_ADMIN_TOKEN
        sync: false
      # ★ 自訂網域（重要）：填你的 HTTPS 網址，例如 https://mathshomework.link
      #   沒填的話程式會用 Render 自動提供的 RENDER_EXTERNAL_URL（onrender.com），
      #   自訂網域會因為 Host 不在白名單而被擋成 403（錯誤訊息：「網站 Host 不在允許清單內。」）。
      #   可用逗號分隔多個；RENDER_EXTERNAL_URL 一律會一併放行，所以健康檢查不會失敗。
      - key: MATH_PUBLIC_ORIGIN
        sync: false
      # --- 網盤（Cloudflare R2）：學生手寫圖、教師批註、題庫圖形、資料庫備份 ---
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      # 改用非 Cloudflare R2 的 S3 相容服務（AWS S3／Backblaze B2／Wasabi／自架 MinIO）時才填：
      # R2_ENDPOINT 指向該服務的端點（此時 R2_ACCOUNT_ID 可留空），
      # R2_REGION 填該 bucket 的 region（R2 留空＝auto，其他服務一定要填，否則回 AuthorizationHeaderMalformed）。
      # 留空即可，程式會沿用預設值。詳見 outputs/MathPath-網盤設定教學.md。
      - key: R2_ENDPOINT
        sync: false
      - key: R2_REGION
        sync: false
      # 自動備份：間隔（小時，留空＝不啟用，建議 24）與保留份數（留空＝14）。
      # 未設定網盤時這兩項不會有任何作用。
      - key: MATH_BACKUP_HOURS
        sync: false
      - key: MATH_BACKUP_KEEP
        sync: false
      # --- 規模調校（留空＝使用預設值，下面註解是預設值）---
      # 同時進行的 AI 請求上限。太小會讓交作業死線前的批次排隊好幾小時；
      # DeepSeek flash 的併發上限是 2500，所以 16 仍遠低於限制。
      - key: MATH_AI_CONCURRENCY
        sync: false            # 預設 16
      # --- AI 用量保險絲（預設關閉，這裡刻意打開）---
      # 每次真的打模型算一次：紙本批改是一頁一次、一鍵全批是一題一次。
      # 30 人一班同時交作業約 150 次呼叫，所以每人每分鐘 30 次不會誤擋正常使用，
      # 但足以擋住「有人一直按重新整理」或前端迴圈把帳單打爆。
      - key: MATH_AI_PER_MINUTE
        value: "30"
      # 每人每日上限。學生一天做 20 題 × 2 次（作答＋再練）＝ 40 次，留足餘裕。
      - key: MATH_AI_PER_DAY
        value: "600"
      # 第二輪自我核對：多問一次「這樣給分對嗎」，只在發現明確錯誤時改分。
      # 成本 +1 次呼叫（每題 3 次），預設關閉；邊界分數常被家長質疑時再開。
      - key: MATH_AI_SECOND_PASS
        value: "off"
      # 等待 SQLite 寫入鎖的秒數。學生集中提交時寫入會排隊，太短會回「database is locked」。
      - key: MATH_DB_TIMEOUT
        sync: false            # 預設 30
      # 教師「一鍵 AI 全部批閱」單次最多處理幾題。一個班 30 人 × 5 題 = 150 題。
      - key: MATH_AI_REVIEW_LIMIT
        sync: false            # 預設 200
      # 備份單檔上限（MB）與上傳逾時（秒）。100 人規模的資料庫約 200 MB，預設很夠用；
      # 學生人數多、或多年不重置學生資料時才需要放大（例如 4096 / 900）。
      - key: MATH_BACKUP_MAX_MB
        sync: false            # 預設 512
      - key: MATH_BACKUP_TIMEOUT
        sync: false            # 預設 300
